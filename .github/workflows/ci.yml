name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -q --ignore=tests/test_e2e_render.py

      - name: Run E2E tests
        run: |
          python -m pytest tests/test_e2e_render.py -v --tb=short

  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile config.py
          python -m py_compile main.py
          python -m py_compile core/arabic_renderer.py
          python -m py_compile core/audio_mixer.py
          python -m py_compile core/hardware.py
          python -m py_compile core/metadata_generator.py
          python -m py_compile core/quality_checker.py
          python -m py_compile core/video_builder.py
          python -m py_compile core/word_highlight.py
          python -m py_compile core/tts_engine.py
          python -m py_compile core/timeline_builder.py
          python -m py_compile core/scene_engine.py
          python -m py_compile core/effects_engine.py
          python -m py_compile core/effect_director.py
          python -m py_compile core/security.py
          python -m py_compile core/dua_database.py

  remotion-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: TypeScript check
        working-directory: remotion
        run: npx tsc --noEmit || true

      - name: Bundle check
        working-directory: remotion
        run: npx remotion bundle --public-dir=public 2>&1 | head -20 || true

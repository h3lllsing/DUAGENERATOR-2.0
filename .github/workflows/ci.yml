name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout bandit pip-audit

      - name: Security scan (Bandit)
        run: |
          bandit -r core/ -ll --skip B101

      - name: Dependency audit (pip-audit)
        run: |
          pip-audit --desc

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -q --ignore=tests/test_e2e_render.py --cov=core --cov-report=term-missing --timeout=30

      - name: Run E2E tests
        run: |
          python -m pytest tests/test_e2e_render.py -v --tb=short --timeout=60

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output/
            temp/
            data/
          retention-days: 7

  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile config.py
          python -m py_compile main.py
          python -m py_compile core/arabic_renderer.py
          python -m py_compile core/audio_mixer.py
          python -m py_compile core/hardware.py
          python -m py_compile core/metadata_generator.py
          python -m py_compile core/quality_checker.py
          python -m py_compile core/video_builder.py
          python -m py_compile core/word_highlight.py
          python -m py_compile core/tts_engine.py
          python -m py_compile core/timeline_builder.py
          python -m py_compile core/scene_engine.py
          python -m py_compile core/effects_engine.py
          python -m py_compile core/effect_director.py
          python -m py_compile core/security.py
          python -m py_compile core/dua_database.py

  remotion-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: npm audit
        working-directory: remotion
        run: npm audit --audit-level=high

      - name: TypeScript check
        working-directory: remotion
        run: npx tsc --noEmit

      - name: Bundle check
        working-directory: remotion
        run: npx remotion bundle --public-dir=public 2>&1 | head -20
